# XcodeGen spec: `cd MDfitApp && xcodegen generate` creates MDfit.xcodeproj (with a SHARED scheme, which CI needs).
# The committed .xcodeproj was made by an older Xcode and lists only 34 of the Swift files, so CI regenerates it
# from this file on every build. Docs: https://github.com/yonaskolb/XcodeGen
name: MDfit
options:
  bundleIdPrefix: com.mdfitsrq
  deploymentTarget:
    iOS: "17.0"            # SwiftData (ModelContainer/ModelContext) is used unguarded in Services/, so iOS 16 can't compile
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"      # CI overwrites with its build number (agvtool) before archiving
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: N6HQNTVSZB
    CODE_SIGN_STYLE: Automatic        # Codemagic's `xcode-project use-profiles` switches this to manual with the fetched profile
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MDfit:
    type: application
    platform: iOS
    sources:
      - path: Sources/MDfit
        name: MDfit
        excludes:
          - "Info.plist"              # referenced via INFOPLIST_FILE below, not copied as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdfitsrq.MDfit     # must match the App Store Connect app record
        PRODUCT_NAME: MDfit
        INFOPLIST_FILE: Sources/MDfit/Info.plist          # the hand-written plist: keeps the calendar/notification usage strings
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  MDfitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        name: MDfitTests
    dependencies:
      - target: MDfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdfitsrq.MDfitTests

schemes:
  MDfit:
    build:
      targets:
        MDfit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDfitTests
    archive:
      config: Release
