# XcodeGen spec: `cd MDfitApp && xcodegen generate` creates MDfit.xcodeproj (with a SHARED scheme, which CI needs).
# CI regenerates the project from this file on every build. The app is a native shell around the member app
# at https://www.mymdfit.com/account (Sources/MDfit); the first native prototype is kept, uncompiled, in Legacy/. Docs: https://github.com/yonaskolb/XcodeGen
name: MDfit
options:
  bundleIdPrefix: com.mdfitsrq
  deploymentTarget:
    iOS: "17.0"            # EKEventEditViewController without calendar permission needs iOS 17
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"      # CI overwrites with its build number (agvtool) before archiving
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: N6HQNTVSZB
    CODE_SIGN_STYLE: Automatic        # Codemagic's `xcode-project use-profiles` switches this to manual with the fetched profile
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MDfit:
    type: application
    platform: iOS
    sources:
      - path: Sources/MDfit
        name: MDfit
        excludes:
          - "Info.plist"              # referenced via INFOPLIST_FILE below, not copied as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdfitsrq.MDfit     # must match the App Store Connect app record
        PRODUCT_NAME: MDfit
        INFOPLIST_FILE: Sources/MDfit/Info.plist          # the hand-written plist: keeps the calendar/notification usage strings
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

schemes:
  MDfit:
    build:
      targets:
        MDfit: all
    run:
      config: Debug
    archive:
      config: Release
