# Codemagic: build the iOS app on a cloud Mac with the latest Xcode and upload it to TestFlight.
# This file must live at the REPO ROOT (Codemagic only reads it from here). The Xcode project is regenerated from
# MDfitApp/project.yml by XcodeGen on every build, so no modern local Xcode is needed.
#
# One-time setup in Codemagic (https://codemagic.io):
#   1. Teams → Integrations → Apple Developer Portal → add an App Store Connect API key and name the integration
#      exactly:  MDfit
#      (Create the key in App Store Connect → Users and Access → Integrations → App Store Connect API → Generate,
#       role "App Manager"; copy Issuer ID + Key ID and upload the .p8, which Apple only shows once.)
#   2. The App Store Connect app record must use bundle id com.mdfitsrq.MDfit (or change it here AND in
#      MDfitApp/project.yml before building).
#   3. Codemagic → the app → Environment variables: add CERTIFICATE_PRIVATE_KEY (group "signing", Secure ticked).
#      Its value is an RSA private key that becomes the signing certificate's key. Make it once on any Mac:
#        ssh-keygen -t rsa -b 2048 -m PEM -f ~/Desktop/mdfit_cert_key -q -N ""
#      then paste the CONTENTS of ~/Desktop/mdfit_cert_key (the file without .pub) as the value. Keep the file.
#   4. Push to main or press "Start new build". First build takes ~15–20 min.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MDfit
    environment:
      xcode: latest
      groups:
        - signing                       # holds CERTIFICATE_PRIVATE_KEY (see step 3 above)
      vars:
        BUNDLE_ID: "com.mdfitsrq.MDfit"
        XCODE_PROJECT: "MDfitApp/MDfit.xcodeproj"
        XCODE_SCHEME: "MDfit"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Generate the Xcode project
        script: |
          command -v xcodegen >/dev/null || brew install xcodegen   # not on every Codemagic image (exit 127 otherwise)
          cd MDfitApp
          rm -rf MDfit.xcodeproj            # the committed project is incomplete; always regenerate
          xcodegen --version
          xcodegen generate
      - name: Set the build number
        # TestFlight needs a higher CFBundleVersion every upload. Codemagic's $BUILD_NUMBER increases with
        # each build of this workflow, so it never repeats.
        script: |
          cd MDfitApp
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Fetch or create the signing certificate and App Store profile
        # Uses the App Store Connect key from the MDfit integration (APP_STORE_CONNECT_* are set by Codemagic).
        # --create makes an Apple Distribution certificate and an App Store profile for the bundle id when none exist.
        script: |
          # Codemagic's variable field flattens a pasted multi-line PEM onto one line, which the CLI rejects as
          # "Not a valid certificate private key". Rebuild the PEM into a file first; accept base64 too.
          set -eo pipefail
          KEY_FILE="$CM_BUILD_DIR/cert_private_key.pem"
          python3 - "$KEY_FILE" <<'PY'
          import os, re, sys, base64
          raw = (os.environ.get("CERTIFICATE_PRIVATE_KEY") or os.environ.get("CM_CERTIFICATE_PRIVATE_KEY") or "").strip()
          if not raw: sys.exit("CERTIFICATE_PRIVATE_KEY (or CM_CERTIFICATE_PRIVATE_KEY) is empty: add it in Codemagic → app settings → Environment variables (group 'signing').")
          if "-----BEGIN" not in raw:            # stored as base64 of the whole file
              raw = base64.b64decode(raw).decode()
          m = re.search(r"-----BEGIN ([A-Z ]*PRIVATE KEY)-----(.*?)-----END \1-----", raw, re.S)
          if not m: sys.exit("CERTIFICATE_PRIVATE_KEY doesn't contain a BEGIN/END PRIVATE KEY block.")
          kind, body = m.group(1), re.sub(r"\s+", "", m.group(2))
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write(f"-----BEGIN {kind}-----\n" + "\n".join(lines) + f"\n-----END {kind}-----\n")
          print(f"private key ok: {kind}, {len(body)} base64 chars")
          PY
          chmod 600 "$KEY_FILE"
          # Prove the key parses before handing it to Apple's tool (which only says "Not a valid certificate private key")
          openssl pkey -in "$KEY_FILE" -noout -check 2>&1 | sed 's/^/openssl: /' || { echo "The key's contents are corrupted. Re-save CERTIFICATE_PRIVATE_KEY from: base64 -i ~/Desktop/mdfit_cert_key | tr -d '\\n' | pbcopy"; exit 1; }
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "@file:$KEY_FILE"
      - name: Add the certificate to the keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Point the Xcode project at the fetched profile
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the .ipa
        script: |
          set +e
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          status=$?
          if [ $status -ne 0 ]; then
            # The filtered output above only shows ❌/⚠️ lines. A compiler crash or an unusual error only appears in the
            # raw xcodebuild log, so surface the lines that matter from there.
            echo "=================== raw xcodebuild diagnostics ==================="
            grep -hnE "error:|Stack dump|Assertion failed|fatal error|Segmentation|Illegal instruction|Program arguments|\*\*\* |note: (Emplaced|Compiling)" /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -vE "warning:|note: Emplaced" | head -120
            echo "=================== end diagnostics ==================="
          fi
          exit $status
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # true also submits for external beta review; needs Test Information filled in App Store Connect first
        # beta_groups: ["MD Fit testers"]   # add once a TestFlight group exists to auto-distribute each build
      email:
        recipients:
          - jaredcabanmdfit@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------------------------------------------
  # Android (android/): the same app in Kotlin. Builds a Play Store bundle (.aab) and a test .apk.
  # One-time setup:
  #   1. Codemagic → Teams → Code signing identities → Android keystores → "Generate" (or upload), reference name
  #      mdfit_keystore. Keep a copy of the keystore + passwords: Play updates must be signed with the same key.
  #   2. Push notifications: Firebase console → add Android app com.mdfitsrq.mdfit → download google-services.json
  #      → commit it as android/app/google-services.json (it is not secret).
  #   3. Publishing to Play: Google Play Console → create the app (package com.mdfitsrq.mdfit), upload the first .aab
  #      by hand once, then add a service-account JSON in Codemagic (Teams → Integrations → Google Play) and
  #      uncomment the google_play block below.
  android:
    name: Android → Play (internal testing)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      java: 17
      android_signing:
        - mdfit_keystore              # skipped with a warning until the keystore exists (debug-signed APK then)
      vars:
        PACKAGE_NAME: "com.mdfitsrq.mdfit"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Build bundle and APK
        script: |
          set -e
          cd android
          export BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          gradle --no-daemon :app:bundleRelease :app:assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
