# Codemagic: build the iOS app on a cloud Mac with the latest Xcode and upload it to TestFlight.
# This file must live at the REPO ROOT (Codemagic only reads it from here). The Xcode project is regenerated from
# MDfitApp/project.yml by XcodeGen on every build, so no modern local Xcode is needed.
#
# One-time setup in Codemagic (https://codemagic.io):
#   1. Teams → Integrations → Apple Developer Portal → add an App Store Connect API key and name the integration
#      exactly:  MDfit
#      (Create the key in App Store Connect → Users and Access → Integrations → App Store Connect API → Generate,
#       role "App Manager"; copy Issuer ID + Key ID and upload the .p8, which Apple only shows once.)
#   2. The App Store Connect app record must use bundle id com.mdfitsrq.MDfit (or change it here AND in
#      MDfitApp/project.yml before building).
#   3. Codemagic → the app → Environment variables: add CERTIFICATE_PRIVATE_KEY (group "signing", Secure ticked).
#      Its value is an RSA private key that becomes the signing certificate's key. Make it once on any Mac:
#        ssh-keygen -t rsa -b 2048 -m PEM -f ~/Desktop/mdfit_cert_key -q -N ""
#      then paste the CONTENTS of ~/Desktop/mdfit_cert_key (the file without .pub) as the value. Keep the file.
#   4. Push to main or press "Start new build". First build takes ~15–20 min.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MDfit
    environment:
      xcode: latest
      groups:
        - signing                       # holds CERTIFICATE_PRIVATE_KEY (see step 3 above)
      vars:
        BUNDLE_ID: "com.mdfitsrq.MDfit"
        XCODE_PROJECT: "MDfitApp/MDfit.xcodeproj"
        XCODE_SCHEME: "MDfit"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Generate the Xcode project
        script: |
          command -v xcodegen >/dev/null || brew install xcodegen   # not on every Codemagic image (exit 127 otherwise)
          cd MDfitApp
          rm -rf MDfit.xcodeproj            # the committed project is incomplete; always regenerate
          xcodegen --version
          xcodegen generate
      - name: Set the build number
        # TestFlight needs a higher CFBundleVersion every upload. Codemagic's $BUILD_NUMBER increases with
        # each build of this workflow, so it never repeats.
        script: |
          cd MDfitApp
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Turn on Push Notifications and Sign in with Apple for the App ID; retire stale profiles
        # The app's entitlements (push, Sign in with Apple) must be enabled on the App ID and included in the
        # provisioning profile. Done through the App Store Connect API with the integration's key,
        # so nobody has to click through developer.apple.com. Profiles that no longer match are deleted; the next
        # step then creates a fresh one.
        script: |
          set -eo pipefail
          python3 - <<'PY'
          import os, re, sys, json, time, base64, subprocess, tempfile, urllib.request, urllib.error
          kid = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]; iss = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          bundle = os.environ["BUNDLE_ID"]
          # The key may be stored flattened onto one line, with literal "\n", or as base64 of the .p8: rebuild a clean PEM
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip()
          # Codemagic's tools also accept pointers here: "@file:/path/key.p8" or "@env:OTHER_VARIABLE"
          for _ in range(3):
              if raw.startswith("@file:"): raw = open(raw[6:].strip()).read().strip()
              elif raw.startswith("@env:"): raw = os.environ.get(raw[5:].strip(), "").strip()
              else: break
          raw = raw.replace("\\n", "\n")
          if "-----BEGIN" not in raw:
              try: raw = base64.b64decode(raw + "=" * (-len(raw) % 4)).decode()
              except Exception: sys.exit(f"APP_STORE_CONNECT_PRIVATE_KEY is not a PEM, base64, @file: or @env: value (length {len(raw)}, starts with {raw[:12]!r})")
          m = re.search(r"-----BEGIN ([A-Z ]*PRIVATE KEY)-----(.*?)-----END \1-----", raw, re.S) or sys.exit("APP_STORE_CONNECT_PRIVATE_KEY has no BEGIN/END PRIVATE KEY block")
          body_ = re.sub(r"\s+", "", m.group(2)); pem = f"-----BEGIN {m.group(1)}-----\n" + "\n".join(body_[i:i+64] for i in range(0, len(body_), 64)) + f"\n-----END {m.group(1)}-----\n"
          kf = tempfile.NamedTemporaryFile("w", suffix=".p8", delete=False); kf.write(pem); kf.close()
          chk = subprocess.run(["openssl", "pkey", "-in", kf.name, "-noout"], capture_output=True, text=True)
          if chk.returncode: sys.exit("The App Store Connect key doesn't parse: " + chk.stderr.strip()[:300])
          b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          head = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
          now = int(time.time()); body = b64(json.dumps({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode())
          sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", kf.name], input=f"{head}.{body}".encode(), capture_output=True)
          if sig.returncode: sys.exit("openssl could not sign with the App Store Connect key: " + sig.stderr.decode().strip()[:300])
          der = sig.stdout
          # DER ECDSA signature -> raw r||s (32 bytes each), which JWT needs
          i = 2; rl = der[i + 1]; r = der[i + 2:i + 2 + rl]; i = i + 2 + rl; sl = der[i + 1]; s_ = der[i + 2:i + 2 + sl]
          raw = r[-32:].rjust(32, b"\0") + s_[-32:].rjust(32, b"\0")
          jwt = f"{head}.{body}.{b64(raw)}"
          def api(method, path, data=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1" + path, method=method,
                  data=json.dumps(data).encode() if data else None, headers={"Authorization": f"Bearer {jwt}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r: return json.loads(r.read() or b"{}") if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  print(f"{method} {path} -> HTTP {e.code}: {e.read().decode()[:300]}"); return None
          ids = api("GET", f"/bundleIds?filter[identifier]={bundle}&include=bundleIdCapabilities") or {}
          match = [d for d in ids.get("data", []) if d["attributes"]["identifier"] == bundle]
          if not match: sys.exit(f"No App ID {bundle} in this team: create it in App Store Connect first.")
          bid = match[0]["id"]
          caps = {c["attributes"]["capabilityType"] for c in ids.get("included", []) if c["type"] == "bundleIdCapabilities"}
          changed = False
          # Sign in with Apple needs its "primary App ID" setting spelled out, or Apple rejects the request
          SETTINGS = {"APPLE_ID_AUTH": [{"key": "APPLE_ID_AUTH_APP_CONSENT", "options": [{"key": "PRIMARY_APP_CONSENT"}]}]}
          for cap, label in (("PUSH_NOTIFICATIONS", "Push Notifications"), ("APPLE_ID_AUTH", "Sign in with Apple")):
              if cap in caps: print(f"{label}: already on"); continue
              attrs = {"capabilityType": cap, **({"settings": SETTINGS[cap]} if cap in SETTINGS else {})}
              r = api("POST", "/bundleIdCapabilities", {"data": {"type": "bundleIdCapabilities", "attributes": attrs,
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid}}}}})
              print(f"{label}:", "turned on" if r else "could not be turned on (see above)")
              if r: changed = True
          # Every App Store profile for this App ID is deleted, so the next step always issues a fresh one that
          # carries the current capabilities (a profile never picks up a capability added after it was made).
          profs = api("GET", f"/profiles?filter[profileType]=IOS_APP_STORE&include=bundleId&limit=200") or {}
          found = 0
          for pr in profs.get("data", []):
              rel = ((pr.get("relationships") or {}).get("bundleId") or {}).get("data") or {}
              if rel.get("id") != bid: continue
              found += 1
              name, state = pr["attributes"]["name"], pr["attributes"]["profileState"]
              r = api("DELETE", f"/profiles/{pr['id']}")
              print(f"profile {name} ({state}): {'deleted' if r is not None else 'could not be deleted (see above)'}")
          print(f"{found} App Store profile(s) for {bundle} found")
          PY
      - name: Fetch or create the signing certificate and App Store profile
        # Uses the App Store Connect key from the MDfit integration (APP_STORE_CONNECT_* are set by Codemagic).
        # --create makes an Apple Distribution certificate and an App Store profile for the bundle id when none exist.
        script: |
          # Codemagic's variable field flattens a pasted multi-line PEM onto one line, which the CLI rejects as
          # "Not a valid certificate private key". Rebuild the PEM into a file first; accept base64 too.
          set -eo pipefail
          KEY_FILE="$CM_BUILD_DIR/cert_private_key.pem"
          python3 - "$KEY_FILE" <<'PY'
          import os, re, sys, base64
          raw = (os.environ.get("CERTIFICATE_PRIVATE_KEY") or os.environ.get("CM_CERTIFICATE_PRIVATE_KEY") or "").strip()
          if not raw: sys.exit("CERTIFICATE_PRIVATE_KEY (or CM_CERTIFICATE_PRIVATE_KEY) is empty: add it in Codemagic → app settings → Environment variables (group 'signing').")
          if "-----BEGIN" not in raw:            # stored as base64 of the whole file
              raw = base64.b64decode(raw).decode()
          m = re.search(r"-----BEGIN ([A-Z ]*PRIVATE KEY)-----(.*?)-----END \1-----", raw, re.S)
          if not m: sys.exit("CERTIFICATE_PRIVATE_KEY doesn't contain a BEGIN/END PRIVATE KEY block.")
          kind, body = m.group(1), re.sub(r"\s+", "", m.group(2))
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write(f"-----BEGIN {kind}-----\n" + "\n".join(lines) + f"\n-----END {kind}-----\n")
          print(f"private key ok: {kind}, {len(body)} base64 chars")
          PY
          chmod 600 "$KEY_FILE"
          # Prove the key parses before handing it to Apple's tool (which only says "Not a valid certificate private key")
          openssl pkey -in "$KEY_FILE" -noout -check 2>&1 | sed 's/^/openssl: /' || { echo "The key's contents are corrupted. Re-save CERTIFICATE_PRIVATE_KEY from: base64 -i ~/Desktop/mdfit_cert_key | tr -d '\\n' | pbcopy"; exit 1; }
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "@file:$KEY_FILE"
      - name: Add the certificate to the keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Point the Xcode project at the fetched profile
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the .ipa
        script: |
          set +e
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          status=$?
          if [ $status -ne 0 ]; then
            # The filtered output above only shows ❌/⚠️ lines. A compiler crash or an unusual error only appears in the
            # raw xcodebuild log, so surface the lines that matter from there.
            echo "=================== raw xcodebuild diagnostics ==================="
            grep -hnE "error:|Stack dump|Assertion failed|fatal error|Segmentation|Illegal instruction|Program arguments|\*\*\* |note: (Emplaced|Compiling)" /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -vE "warning:|note: Emplaced" | head -120
            echo "=================== end diagnostics ==================="
          fi
          exit $status
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # true also submits for external beta review; needs Test Information filled in App Store Connect first
        # beta_groups: ["MD Fit testers"]   # add once a TestFlight group exists to auto-distribute each build
      email:
        recipients:
          - jaredcabanmdfit@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------------------------------------------
  # Android (android/): the same app in Kotlin. Builds a Play Store bundle (.aab) and a test .apk.
  # One-time setup:
  #   1. Signing: Codemagic → the app → Environment variables, group "signing" (the same group the iOS workflow
  #      already uses), Secure ticked on every one:
  #        MDFIT_KEYSTORE           base64 of upload-keystore.jks   (base64 -w0 upload-keystore.jks)
  #        MDFIT_KEYSTORE_PASSWORD  the keystore password
  #        MDFIT_KEY_ALIAS          the key alias (mdfit)
  #        MDFIT_KEY_PASSWORD       the key password
  #      The keystore deliberately does NOT use `android_signing:` / team code signing identities: those resolve
  #      only inside the account that owns the app, so a keystore uploaded to the wrong team fails the build with
  #      "No keystores with reference 'mdfit_keystore' were found". App environment variables always resolve.
  #      Keep a copy of the keystore + passwords: Play updates must be signed with the same key, forever.
  #   2. Push notifications: Firebase console → add Android app com.mdfitsrq.mdfit → download google-services.json
  #      → commit it as android/app/google-services.json (it is not secret).
  #   3. Publishing to Play: Google Play Console → create the app (package com.mdfitsrq.mdfit), upload the first .aab
  #      by hand once, then add a service-account JSON in Codemagic (Teams → Integrations → Google Play) and
  #      uncomment the google_play block below.
  android:
    name: Android → Play (internal testing)
    max_build_duration: 45
    # mac_mini_m2, not linux_x2: Linux and Windows instances need billing enabled on the account, while a personal
    # account gets 500 free macOS M2 minutes a month. Gradle 8.14.1, Java 17 and the Android SDK are preinstalled on
    # the macOS image, so the bundle builds the same. (Switch to linux_x2 if you ever add emulator tests: Apple
    # silicon can't run Android emulators.)
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - signing                     # holds the MDFIT_KEYSTORE* variables above (shared with the iOS workflow)
      vars:
        PACKAGE_NAME: "com.mdfitsrq.mdfit"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Build bundle and APK
        script: |
          set -e
          # Release signing: rebuild the keystore from the secure variables, then export the CM_* names that
          # android/app/build.gradle.kts already reads. Without them the APK is debug-signed and Play rejects it.
          if [ -n "${MDFIT_KEYSTORE:-}" ]; then
            export CM_KEYSTORE_PATH="$HOME/mdfit_keystore.jks"
            printf '%s' "$MDFIT_KEYSTORE" | tr -d '[:space:]' | base64 --decode > "$CM_KEYSTORE_PATH"
            export CM_KEYSTORE_PASSWORD="$MDFIT_KEYSTORE_PASSWORD"
            export CM_KEY_ALIAS="${MDFIT_KEY_ALIAS:-mdfit}"
            export CM_KEY_PASSWORD="${MDFIT_KEY_PASSWORD:-$MDFIT_KEYSTORE_PASSWORD}"
            keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null \
              || { echo "The keystore did not open. Check MDFIT_KEYSTORE (base64 of the .jks), MDFIT_KEYSTORE_PASSWORD and MDFIT_KEY_ALIAS."; exit 1; }
            echo "Release signing ready: alias $CM_KEY_ALIAS."
          else
            echo "MDFIT_KEYSTORE is not set, so this build is debug-signed and Play will not accept it."
          fi
          cd android
          export BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          gradle --no-daemon :app:bundleRelease :app:assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt
    # ---- Send each build to your Android testers (Firebase App Distribution) ----
    # Testers get an email with an install link. No Play Store review, no waiting. To switch it on:
    #   1. Google Cloud console → IAM → find firebase-adminsdk-fbsvc@mdfit-6c618.iam.gserviceaccount.com
    #      → Edit → Add another role → "Firebase App Distribution Admin" → Save.
    #   2. Firebase console → Run → App Distribution → Testers & Groups → create a group named: testers
    #      → add the tester email addresses.
    #   3. Codemagic → the app → Environment variables: FIREBASE_SERVICE_ACCOUNT = the whole
    #      firebase-adminsdk JSON file, group "signing", Secure ticked.
    # Then delete the leading "#" from the six lines below.
    # publishing:
    #   firebase:
    #     firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
    #     android:
    #       app_id: 1:853081441902:android:3d62da0772dc70c7c1087f   # from google-services.json
    #       groups:
    #         - testers
    #       artifact_type: apk      # testers install an APK; the .aab is for Play
    #
    # ---- Later: publish straight to Google Play (needs the app to exist there first) ----
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
